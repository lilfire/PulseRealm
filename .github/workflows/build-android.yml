name: Build Android APK

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "client/android/**"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x client/android/gradlew

      - name: Build Debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulserealm-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Get version and tag
        if: github.ref == 'refs/heads/main'
        id: version
        working-directory: client/android
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="android-v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
            TAG="android-v${VERSION}-${TIMESTAMP}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PulseRealm Android v${{ steps.version.outputs.name }}
          body: |
            Android debug APK built from main branch.

            Commit: ${{ github.sha }}
          files: client/android/app/build/outputs/apk/debug/*.apk
          make_latest: true

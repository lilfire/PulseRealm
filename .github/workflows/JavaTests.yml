name: Run Android Tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to test (e.g. app, wear, :shared:models)'
        required: false
        default: ''
      test_filter:
        description: 'Specific test class or method (e.g. com.example.MyTest)'
        required: false
        default: ''

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run tests
        run: |
          if [ -n "${{ github.event.inputs.module }}" ] && [ -n "${{ github.event.inputs.test_filter }}" ]; then
            ./gradlew :${{ github.event.inputs.module }}:test --tests "${{ github.event.inputs.test_filter }}"
          elif [ -n "${{ github.event.inputs.module }}" ]; then
            ./gradlew :${{ github.event.inputs.module }}:test
          else
            ./gradlew test
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

name: Manual Build and Push to GHCR
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0 or latest)'
        required: true
        default: 'latest'
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-tagged:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Tagged
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.inputs.tag }}
          labels: |
            org.opencontainers.image.description=A live treadmill session platform with wearable integration and multiple run modes.
            org.opencontainers.image.documentation=https://github.com/lilfire/pulserealm/blob/main/CHANGELOG.md
            org.opencontainers.image.source=https://github.com/lilfire/pulserealm

  build-latest:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.description=A live treadmill session platform with wearable integration and multiple run modes.
            org.opencontainers.image.documentation=https://github.com/lilfire/pulserealm/blob/main/CHANGELOG.md
            org.opencontainers.image.source=https://github.com/lilfire/pulserealm

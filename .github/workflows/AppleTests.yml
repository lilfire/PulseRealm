name: Run Apple Tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Apple watchOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find and boot watchOS simulator
        id: simulator
        run: |
          # Find the first available Apple Watch simulator
          INFO=$(xcrun simctl list devices watchOS available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'watchOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'Apple Watch' in d['name']:
                      parts = runtime.rsplit('.', 1)[-1].replace('watchOS-', '').replace('-', '.')
                      print(f'{d[\"name\"]}|{d[\"udid\"]}|{parts}')
                      sys.exit(0)
          sys.exit(1)
          ")
          SIM_NAME=$(echo "$INFO" | cut -d'|' -f1)
          SIM_UDID=$(echo "$INFO" | cut -d'|' -f2)
          SIM_OS=$(echo "$INFO" | cut -d'|' -f3)
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "os=$SIM_OS" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_NAME (OS $SIM_OS, UDID $SIM_UDID)"

          # Pre-boot the simulator
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          echo "Waiting for simulator to finish booting..."
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build for testing
        working-directory: client/apple
        run: |
          set -o pipefail
          mkdir -p build

          DEST="platform=watchOS Simulator,id=${{ steps.simulator.outputs.udid }}"

          xcodebuild build-for-testing \
            -project PulseRealm.xcodeproj \
            -scheme "PulseRealm Watch App" \
            -destination "$DEST" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/xcodebuild-build.log

      - name: Run tests
        working-directory: client/apple
        timeout-minutes: 5
        run: |
          set -o pipefail

          DEST="platform=watchOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          TESTRUN=$(find build/DerivedData -name '*.xctestrun' -type f | head -1)
          echo "Found xctestrun: $TESTRUN"

          xcodebuild test-without-building \
            -xctestrun "$TESTRUN" \
            -destination "$DEST" \
            -resultBundlePath build/TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            -default-test-execution-time-allowance 30 \
            2>&1 | tee build/xcodebuild-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-results
          path: client/apple/build/
          retention-days: 7

name: Run Apple Tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Apple SPM Unit Tests
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        working-directory: client/apple
        run: swift test

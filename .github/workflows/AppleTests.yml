name: Run Apple Tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Apple watchOS Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find watchOS simulator
        id: simulator
        run: |
          # Find the first available Apple Watch simulator (arm64)
          INFO=$(xcrun simctl list devices watchOS available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'watchOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'Apple Watch' in d['name']:
                      # Extract OS version from runtime key
                      # e.g. com.apple.CoreSimulator.SimRuntime.watchOS-26-2 -> 26.2
                      parts = runtime.rsplit('.', 1)[-1].replace('watchOS-', '').replace('-', '.')
                      print(f'{d[\"name\"]}|{d[\"udid\"]}|{parts}')
                      sys.exit(0)
          sys.exit(1)
          ")
          SIM_NAME=$(echo "$INFO" | cut -d'|' -f1)
          SIM_UDID=$(echo "$INFO" | cut -d'|' -f2)
          SIM_OS=$(echo "$INFO" | cut -d'|' -f3)
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "os=$SIM_OS" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_NAME (OS $SIM_OS, UDID $SIM_UDID)"

      - name: Build and test
        working-directory: client/apple
        run: |
          set -o pipefail
          mkdir -p build

          DEST="platform=watchOS Simulator,id=${{ steps.simulator.outputs.udid }}"

          # Build for testing first
          xcodebuild build-for-testing \
            -project PulseRealm.xcodeproj \
            -scheme "PulseRealm Watch App" \
            -destination "$DEST" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/xcodebuild-build.log

          # Find the xctestrun file
          TESTRUN=$(find build/DerivedData -name '*.xctestrun' -type f | head -1)
          echo "Found xctestrun: $TESTRUN"

          # Run tests using the built products
          xcodebuild test-without-building \
            -xctestrun "$TESTRUN" \
            -destination "$DEST" \
            -resultBundlePath build/TestResults.xcresult \
            2>&1 | tee build/xcodebuild-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-results
          path: client/apple/build/
          retention-days: 7

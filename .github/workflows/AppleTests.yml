name: Run Apple Tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Apple watchOS Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project info
        working-directory: client/apple
        run: xcodebuild -list -project PulseRealm.xcodeproj

      - name: Find watchOS simulator
        id: simulator
        run: |
          # Find the first available Apple Watch simulator
          DEST=$(xcrun simctl list devices watchOS available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'watchOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'Apple Watch' in d['name']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEST"

      - name: Build for testing
        working-directory: client/apple
        run: |
          mkdir -p build
          xcodebuild build-for-testing \
            -project PulseRealm.xcodeproj \
            -scheme "PulseRealm Watch App" \
            -destination "platform=watchOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/xcodebuild-build.log

      - name: Run tests
        working-directory: client/apple
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PulseRealm.xcodeproj \
            -scheme "PulseRealm Watch App" \
            -destination "platform=watchOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -resultBundlePath build/TestResults.xcresult \
            2>&1 | tee build/xcodebuild-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-results
          path: client/apple/build/
          retention-days: 7
